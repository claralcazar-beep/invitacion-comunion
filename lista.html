<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Confirmaciones · Primera Comunión</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--musgo:#2F4A2E;--hoja:#6B8F5E;--salvia:#A9BE9A;--beige:#EFE6D3;--arena:#D9C9A6;--crudo:#FBF8F1;--oro:#B8955A;--tinta:#1F2A1E;--rojo:#8a3b2a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Karla,system-ui,sans-serif;background:var(--crudo);color:var(--tinta);line-height:1.45}
  .wrap{width:min(100%,560px);margin:0 auto;padding:22px 18px 60px}
  h1{font-family:Fraunces,serif;font-weight:600;color:var(--musgo);font-size:1.7rem;line-height:1.1}
  .sub{font-family:Fraunces,serif;font-style:italic;font-weight:300;color:#5a6656;margin-top:4px}
  .k{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hoja);font-weight:700}
  input{width:100%;padding:13px 14px;border:1px solid var(--arena);border-radius:12px;background:#fff;font:inherit;font-size:1rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:999px;border:1px solid var(--musgo);background:var(--musgo);color:var(--crudo);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--musgo)}
  .btn.sm{padding:8px 12px;font-size:.8rem}
  .btn[disabled]{opacity:.6}
  .login{margin-top:40px;background:var(--beige);border-radius:20px;padding:22px}
  .login .btn{width:100%;margin-top:14px}
  .err{color:var(--rojo);font-size:.9rem;margin-top:10px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
  .stat{background:var(--beige);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-family:Fraunces,serif;font-weight:600;font-size:1.9rem;color:var(--musgo);line-height:1}
  .stat small{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hoja);font-weight:700}
  .stat.total{background:var(--musgo)} .stat.total b,.stat.total small{color:var(--beige)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
  .chips{display:flex;gap:6px;flex:1}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--arena);background:#fff;font:inherit;font-size:.8rem;font-weight:700;color:var(--musgo);cursor:pointer}
  .chip.sel{background:var(--musgo);color:var(--crudo);border-color:var(--musgo)}
  .card{background:#fff;border:1px solid var(--arena);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .card.no{opacity:.7;background:var(--beige)}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .name{font-family:Fraunces,serif;font-weight:600;font-size:1.15rem;color:var(--musgo)}
  .pill{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--salvia);color:var(--musgo);white-space:nowrap}
  .pill.no{background:var(--arena)}
  .meta{font-size:.85rem;color:#5a6656;margin-top:4px}
  .meta a{color:var(--musgo);font-weight:700;text-decoration:none}
  .msg{margin-top:8px;font-family:Fraunces,serif;font-style:italic;color:#3f4a3c;border-left:3px solid var(--oro);padding-left:10px}
  .acts{margin-top:10px;display:flex;gap:8px;justify-content:flex-end}
  .del{background:transparent;border:0;color:var(--rojo);font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline}
  .empty{text-align:center;color:#5a6656;padding:40px 0;font-family:Fraunces,serif;font-style:italic}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Confirmaciones</h1>
  <div class="sub">Primera Comunión de Juan Alejandro y Juan Ángel · 19 de septiembre</div>

  <!-- Clave -->
  <div class="login" id="login">
    <div class="k">Clave de acceso</div>
    <input id="clave" type="password" placeholder="••••••••" autocomplete="current-password" style="margin-top:8px">
    <button class="btn" id="entrar">Ver la lista</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- Panel -->
  <div id="panel" class="hide">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div class="chips" id="filtro">
        <button class="chip sel" data-f="si">Asisten</button>
        <button class="chip" data-f="no">No asisten</button>
        <button class="chip" data-f="todos">Todos</button>
      </div>
      <button class="btn ghost sm" id="csv">Exportar</button>
      <button class="btn ghost sm" id="refrescar">Actualizar</button>
    </div>
    <div id="lista"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://valyttwwcrsuwtwhnmez.supabase.co";
const SUPABASE_KEY = "sb_publishable__flMBX4HygEUQ2C_nVRm4Q_b6olRccY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let clave = sessionStorage.getItem("clave") || "", datos = [], filtro = "si";
const $ = id => document.getElementById(id);

async function cargar(){
  const { data, error } = await sb.rpc("listar_confirmaciones", { clave });
  if (error) throw error;
  return data || [];
}

async function entrar(){
  clave = $("clave").value.trim(); $("loginErr").textContent = "";
  $("entrar").disabled = true; $("entrar").textContent = "Verificando…";
  try {
    datos = await cargar();
    if (datos.length === 0){
      $("loginErr").textContent = "Sin registros aún, o la clave no es correcta.";
    }
    sessionStorage.setItem("clave", clave);
    mostrar();
  } catch(e){ $("loginErr").textContent = "No se pudo conectar. Revisa que ejecutaste supabase-lista.sql."; console.error(e); }
  $("entrar").disabled = false; $("entrar").textContent = "Ver la lista";
}

function mostrar(){
  $("login").classList.add("hide"); $("panel").classList.remove("hide");
  const si = datos.filter(d => d.asiste), no = datos.filter(d => !d.asiste);
  const ad = si.reduce((a,d)=>a+d.adultos,0), ni = si.reduce((a,d)=>a+d.ninos,0);
  $("stats").innerHTML = `
    <div class="stat total"><b>${ad+ni}</b><small>Personas</small></div>
    <div class="stat"><b>${ad}</b><small>Adultos</small></div>
    <div class="stat"><b>${ni}</b><small>Niños</small></div>
    <div class="stat"><b>${si.length}</b><small>Familias</small></div>`;
  const lista = filtro === "todos" ? datos : filtro === "si" ? si : no;
  $("lista").innerHTML = lista.length ? lista.map(d => `
    <div class="card ${d.asiste ? "" : "no"}">
      <div class="row">
        <div class="name">${esc(d.nombre)}</div>
        <span class="pill ${d.asiste ? "" : "no"}">${d.asiste ? `${d.adultos} adulto${d.adultos!==1?"s":""} · ${d.ninos} niño${d.ninos!==1?"s":""}` : "No asiste"}</span>
      </div>
      <div class="meta">${fecha(d.creado_en)}${d.telefono ? ` · <a href="https://wa.me/57${d.telefono.replace(/\D/g,"")}" target="_blank" rel="noopener">${esc(d.telefono)}</a>` : ""}</div>
      ${d.mensaje ? `<div class="msg">${esc(d.mensaje)}</div>` : ""}
      <div class="acts"><button class="del" data-id="${d.id}" data-n="${esc(d.nombre)}">Eliminar</button></div>
    </div>`).join("") : `<div class="empty">Todavía no hay confirmaciones en esta vista.</div>`;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fecha = iso => new Date(iso).toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"America/Bogota"});

$("entrar").onclick = entrar;
$("clave").addEventListener("keydown", e => e.key === "Enter" && entrar());
$("filtro").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; filtro = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("sel", x === b)); mostrar(); };
$("refrescar").onclick = async () => { datos = await cargar(); mostrar(); };
$("lista").onclick = async e => {
  const b = e.target.closest(".del"); if(!b) return;
  if (!confirm(`¿Eliminar la confirmación de ${b.dataset.n}?`)) return;
  const { data } = await sb.rpc("eliminar_confirmacion", { clave, fila: +b.dataset.id });
  if (data) { datos = await cargar(); mostrar(); } else alert("No se pudo eliminar.");
};
$("csv").onclick = () => {
  const filas = [["Nombre","Teléfono","Asiste","Adultos","Niños","Mensaje","Fecha"],
    ...datos.map(d => [d.nombre, d.telefono||"", d.asiste?"Sí":"No", d.adultos, d.ninos, d.mensaje||"", fecha(d.creado_en)])];
  const csv = "\uFEFF" + filas.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download = "confirmaciones.csv"; a.click();
};
if (clave){ $("clave").value = clave; entrar(); }
</script>
</body>
</html>
