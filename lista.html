<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Primera Comunión</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--musgo:#2F4A2E;--hoja:#6B8F5E;--salvia:#A9BE9A;--beige:#EFE6D3;--arena:#D9C9A6;--crudo:#FBF8F1;--oro:#B8955A;--tinta:#1F2A1E;--rojo:#8a3b2a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Karla,system-ui,sans-serif;background:var(--crudo);color:var(--tinta);line-height:1.45}
  .wrap{width:min(100%,600px);margin:0 auto;padding:22px 18px 80px}
  h1{font-family:Fraunces,serif;font-weight:600;color:var(--musgo);font-size:1.7rem;line-height:1.1}
  .sub{font-family:Fraunces,serif;font-style:italic;font-weight:300;color:#5a6656;margin-top:4px}
  .k{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hoja);font-weight:700}
  input,textarea{width:100%;padding:12px 14px;border:1px solid var(--arena);border-radius:12px;background:#fff;font:inherit;font-size:1rem}
  textarea{min-height:110px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:999px;border:1px solid var(--musgo);background:var(--musgo);color:var(--crudo);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--musgo)}
  .btn.sm{padding:8px 12px;font-size:.8rem}
  .btn[disabled]{opacity:.6}
  .login{margin-top:40px;background:var(--beige);border-radius:20px;padding:22px}
  .login .btn{width:100%;margin-top:14px}
  .err{color:var(--rojo);font-size:.9rem;margin-top:10px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 6px;background:var(--beige);padding:5px;border-radius:999px}
  .tabs button{padding:11px;border-radius:999px;border:0;background:transparent;font:inherit;font-weight:700;color:var(--musgo);cursor:pointer}
  .tabs button.sel{background:var(--musgo);color:var(--crudo)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .stat{background:var(--beige);border-radius:14px;padding:12px 6px;text-align:center}
  .stat b{display:block;font-family:Fraunces,serif;font-weight:600;font-size:1.8rem;color:var(--musgo);line-height:1}
  .stat small{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--hoja);font-weight:700}
  .stat.total{background:var(--musgo)} .stat.total b,.stat.total small{color:var(--beige)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
  .chips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--arena);background:#fff;font:inherit;font-size:.8rem;font-weight:700;color:var(--musgo);cursor:pointer}
  .chip.sel{background:var(--musgo);color:var(--crudo);border-color:var(--musgo)}
  .card{background:#fff;border:1px solid var(--arena);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .card.no{opacity:.75;background:var(--beige)}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .name{font-family:Fraunces,serif;font-weight:600;font-size:1.12rem;color:var(--musgo)}
  .pill{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--salvia);color:var(--musgo);white-space:nowrap}
  .pill.no{background:var(--arena)} .pill.wait{background:#fff;border:1px solid var(--arena);color:#5a6656} .pill.gold{background:var(--oro);color:#fff}
  .meta{font-size:.85rem;color:#5a6656;margin-top:4px}
  .meta a{color:var(--musgo);font-weight:700;text-decoration:none}
  .msg{margin-top:8px;font-family:Fraunces,serif;font-style:italic;color:#3f4a3c;border-left:3px solid var(--oro);padding-left:10px}
  .acts{margin-top:10px;display:flex;gap:14px;justify-content:flex-end;align-items:center}
  .del{background:transparent;border:0;color:var(--rojo);font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline}
  .check{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--musgo);cursor:pointer;user-select:none}
  .check input{width:20px;height:20px;accent-color:var(--musgo);padding:0}
  .empty{text-align:center;color:#5a6656;padding:40px 0;font-family:Fraunces,serif;font-style:italic}
  .add{background:var(--beige);border-radius:18px;padding:16px;margin:0 0 14px}
  .add .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .add .btn{margin-top:10px}
  .toggle{background:transparent;border:0;color:var(--musgo);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;font-size:.85rem}
  .hide{display:none}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--musgo);color:var(--crudo);padding:10px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel de la Primera Comunión</h1>
  <div class="sub">Juan Alejandro y Juan Ángel · 19 de septiembre</div>

  <div class="login" id="login">
    <div class="k">Clave de acceso</div>
    <input id="clave" type="password" placeholder="••••••••" autocomplete="current-password" style="margin-top:8px">
    <button class="btn" id="entrar">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="panel" class="hide">
    <div class="tabs"><button class="sel" data-tab="inv">Invitados</button><button data-tab="conf">Confirmaciones</button></div>

    <!-- ================= INVITADOS ================= -->
    <div id="tabInv">
      <div class="stats" id="statsInv"></div>
      <div class="add">
        <div class="k">Agregar invitado</div>
        <div class="grid">
          <input id="nuevoNombre" placeholder="Nombre y apellido">
          <input id="nuevoTel" placeholder="Celular (opcional)" inputmode="tel">
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn sm" id="agregar">Agregar</button>
          <button class="toggle" id="verImportar">Pegar una lista completa</button>
        </div>
        <div id="importar" class="hide" style="margin-top:12px">
          <div class="k">Un invitado por línea · "Nombre, celular" (el celular es opcional)</div>
          <textarea id="lineas" placeholder="María Fernanda Ortiz, 3105551234&#10;Familia Pérez Gómez&#10;Carlos Andrés, 3001112233" style="margin-top:6px"></textarea>
          <button class="btn sm" id="importarBtn">Importar</button>
        </div>
      </div>
      <div class="bar">
        <div class="chips" id="filtroInv">
          <button class="chip sel" data-f="todos">Todos</button>
          <button class="chip" data-f="pend">Sin enviar</button>
          <button class="chip" data-f="env">Enviados</button>
          <button class="chip" data-f="sinresp">Sin respuesta</button>
          <button class="chip" data-f="conf">Confirmaron</button>
        </div>
        <button class="btn ghost sm" id="pdfInv">PDF</button>
      </div>
      <div id="listaInv"></div>
    </div>

    <!-- ================= CONFIRMACIONES ================= -->
    <div id="tabConf" class="hide">
      <div class="stats" id="statsConf"></div>
      <div class="bar">
        <div class="chips" id="filtroConf">
          <button class="chip sel" data-f="si">Asisten</button>
          <button class="chip" data-f="no">No asisten</button>
          <button class="chip" data-f="todos">Todos</button>
        </div>
        <button class="btn ghost sm" id="pdfConf">PDF</button>
        <button class="btn ghost sm" id="refrescar">Actualizar</button>
      </div>
      <div id="listaConf"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const SUPABASE_URL = "https://valyttwwcrsuwtwhnmez.supabase.co";
const SUPABASE_KEY = "sb_publishable__flMBX4HygEUQ2C_nVRm4Q_b6olRccY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fecha = iso => new Date(iso).toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"America/Bogota"});
const dig = t => String(t ?? "").replace(/\D/g,"").slice(-10);
const norm = t => String(t ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
function toast(t){ const x=$("toast"); x.textContent=t; x.classList.add("show"); setTimeout(()=>x.classList.remove("show"),1800); }

let clave = sessionStorage.getItem("clave") || "", conf = [], inv = [], fConf = "si", fInv = "todos";

async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, {clave, ...args}); if (error) throw error; return data; }
async function cargarTodo(){ [conf, inv] = await Promise.all([rpc("listar_confirmaciones",{}), rpc("listar_invitados",{})]); }

/* ---------- cruce invitado ↔ confirmación ---------- */
function confirmacionDe(i){
  const tel = dig(i.telefono), nom = norm(i.nombre);
  return conf.find(c => (tel && dig(c.telefono) === tel)) ||
         conf.find(c => norm(c.nombre) === nom) ||
         conf.find(c => nom.length > 6 && (norm(c.nombre).includes(nom) || nom.includes(norm(c.nombre))));
}

/* ---------- login ---------- */
async function entrar(){
  clave = $("clave").value.trim(); $("loginErr").textContent = "";
  $("entrar").disabled = true; $("entrar").textContent = "Verificando…";
  try {
    await cargarTodo();
    if (!conf.length && !inv.length){ $("loginErr").textContent = "Sin registros aún, o la clave no es correcta."; }
    sessionStorage.setItem("clave", clave); mostrar();
  } catch(e){ $("loginErr").textContent = "No se pudo conectar. Revisa que ejecutaste supabase-lista.sql y supabase-invitados.sql."; console.error(e); }
  $("entrar").disabled = false; $("entrar").textContent = "Entrar";
}
$("entrar").onclick = entrar; $("clave").addEventListener("keydown", e => e.key==="Enter" && entrar());
if (clave){ $("clave").value = clave; entrar(); }

function mostrar(){ $("login").classList.add("hide"); $("panel").classList.remove("hide"); pintarInv(); pintarConf(); }

/* ---------- pestañas ---------- */
document.querySelector(".tabs").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("sel",x===b));
  $("tabInv").classList.toggle("hide", b.dataset.tab!=="inv"); $("tabConf").classList.toggle("hide", b.dataset.tab!=="conf"); };

/* ================= INVITADOS ================= */
function pintarInv(){
  const filas = inv.map(i => ({...i, c: confirmacionDe(i)}));
  const env = filas.filter(f=>f.enviado), confs = filas.filter(f=>f.c && f.c.asiste), sinresp = filas.filter(f=>f.enviado && !f.c);
  $("statsInv").innerHTML = `
    <div class="stat total"><b>${filas.length}</b><small>Invitados</small></div>
    <div class="stat"><b>${env.length}</b><small>Enviados</small></div>
    <div class="stat"><b>${confs.length}</b><small>Confirmaron</small></div>
    <div class="stat"><b>${sinresp.length}</b><small>Sin respuesta</small></div>`;
  const lista = filas.filter(f => fInv==="todos" || (fInv==="pend" && !f.enviado) || (fInv==="env" && f.enviado) || (fInv==="sinresp" && f.enviado && !f.c) || (fInv==="conf" && f.c));
  $("listaInv").innerHTML = lista.length ? lista.map(f => {
    const estado = f.c ? (f.c.asiste ? `<span class="pill">Confirmó · ${f.c.adultos} ad · ${f.c.ninos} ni</span>` : `<span class="pill no">No asiste</span>`)
                       : (f.enviado ? `<span class="pill wait">Sin respuesta</span>` : `<span class="pill gold">Por enviar</span>`);
    const tel = f.telefono ? ` · <a href="https://wa.me/57${dig(f.telefono)}" target="_blank" rel="noopener">${esc(f.telefono)}</a>` : "";
    return `<div class="card">
      <div class="row"><div class="name">${esc(f.nombre)}</div>${estado}</div>
      <div class="meta">Agregado ${fecha(f.creado_en)}${tel}${f.notas?` · ${esc(f.notas)}`:""}</div>
      <div class="acts">
        <label class="check"><input type="checkbox" data-id="${f.id}" ${f.enviado?"checked":""}> Invitación enviada</label>
        <button class="del" data-id="${f.id}" data-n="${esc(f.nombre)}">Eliminar</button>
      </div></div>`; }).join("") : `<div class="empty">Nada en esta vista.</div>`;
}
$("filtroInv").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; fInv=b.dataset.f;
  $("filtroInv").querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b)); pintarInv(); };
$("listaInv").addEventListener("change", async e => {
  const cb = e.target.closest("input[type=checkbox]"); if(!cb) return;
  const ok = await rpc("marcar_enviado",{fila:+cb.dataset.id, valor:cb.checked});
  if(!ok){ cb.checked=!cb.checked; toast("No se pudo guardar"); return; }
  const it = inv.find(i=>i.id===+cb.dataset.id); it.enviado = cb.checked; pintarInv();
});
$("listaInv").addEventListener("click", async e => {
  const b = e.target.closest(".del"); if(!b) return;
  if(!confirm(`¿Eliminar a ${b.dataset.n} de la lista de invitados?`)) return;
  if(await rpc("eliminar_invitado",{fila:+b.dataset.id})){ inv = inv.filter(i=>i.id!==+b.dataset.id); pintarInv(); } else toast("No se pudo eliminar");
});
$("agregar").onclick = async () => {
  const n = $("nuevoNombre").value.trim(); if(n.length<2){ $("nuevoNombre").focus(); return; }
  const id = await rpc("guardar_invitado",{p_nombre:n, p_telefono:$("nuevoTel").value.trim()||null});
  if(!id){ toast("No se pudo guardar"); return; }
  inv = await rpc("listar_invitados",{}); $("nuevoNombre").value=""; $("nuevoTel").value=""; pintarInv(); toast("Agregado");
};
$("nuevoNombre").addEventListener("keydown", e => e.key==="Enter" && $("agregar").click());
$("verImportar").onclick = () => $("importar").classList.toggle("hide");
$("importarBtn").onclick = async () => {
  const lineas = $("lineas").value.split("\n").map(l=>l.trim()).filter(Boolean); if(!lineas.length) return;
  const n = await rpc("importar_invitados",{lineas});
  inv = await rpc("listar_invitados",{}); $("lineas").value=""; $("importar").classList.add("hide"); pintarInv(); toast(`${n} invitado${n!==1?"s":""} agregado${n!==1?"s":""}`);
};

/* ================= CONFIRMACIONES ================= */
function pintarConf(){
  const si = conf.filter(d=>d.asiste), no = conf.filter(d=>!d.asiste);
  const ad = si.reduce((a,d)=>a+d.adultos,0), ni = si.reduce((a,d)=>a+d.ninos,0);
  $("statsConf").innerHTML = `
    <div class="stat total"><b>${ad+ni}</b><small>Personas</small></div>
    <div class="stat"><b>${ad}</b><small>Adultos</small></div>
    <div class="stat"><b>${ni}</b><small>Niños</small></div>
    <div class="stat"><b>${si.length}</b><small>Familias</small></div>`;
  const lista = fConf==="todos" ? conf : fConf==="si" ? si : no;
  $("listaConf").innerHTML = lista.length ? lista.map(d => `
    <div class="card ${d.asiste?"":"no"}">
      <div class="row"><div class="name">${esc(d.nombre)}</div>
        <span class="pill ${d.asiste?"":"no"}">${d.asiste?`${d.adultos} adulto${d.adultos!==1?"s":""} · ${d.ninos} niño${d.ninos!==1?"s":""}`:"No asiste"}</span></div>
      <div class="meta">${fecha(d.creado_en)}${d.telefono?` · <a href="https://wa.me/57${dig(d.telefono)}" target="_blank" rel="noopener">${esc(d.telefono)}</a>`:""}</div>
      ${d.mensaje?`<div class="msg">${esc(d.mensaje)}</div>`:""}
      <div class="acts"><button class="del" data-id="${d.id}" data-n="${esc(d.nombre)}">Eliminar</button></div>
    </div>`).join("") : `<div class="empty">Todavía no hay confirmaciones en esta vista.</div>`;
}
$("filtroConf").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; fConf=b.dataset.f;
  $("filtroConf").querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===b)); pintarConf(); };
$("refrescar").onclick = async () => { await cargarTodo(); pintarInv(); pintarConf(); toast("Actualizado"); };
$("listaConf").addEventListener("click", async e => {
  const b = e.target.closest(".del"); if(!b) return;
  if(!confirm(`¿Eliminar la confirmación de ${b.dataset.n}?`)) return;
  if(await rpc("eliminar_confirmacion",{fila:+b.dataset.id})){ await cargarTodo(); pintarInv(); pintarConf(); } else toast("No se pudo eliminar");
});

/* ================= PDF ================= */
function pdfBase(titulo, sub){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:"mm", format:"a4"});
  doc.setFillColor(47,74,46); doc.rect(0,0,210,30,"F");
  doc.setTextColor(251,248,241); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Primera Comunión · Juan Alejandro y Juan Ángel", 14, 13);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Sábado 19 de septiembre de 2026 · Catedral de Ibagué · Finca Magakú Campestre", 14, 20);
  doc.setTextColor(47,74,46); doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.text(titulo, 14, 40);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90,102,86); doc.text(sub, 14, 46);
  return doc;
}
const estilo = { headStyles:{fillColor:[47,74,46], textColor:[251,248,241]}, alternateRowStyles:{fillColor:[245,240,228]}, styles:{font:"helvetica", fontSize:9.5, cellPadding:2.5}, margin:{left:14,right:14} };
function pie(doc){ const n = doc.internal.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150); doc.text(`Generado ${new Date().toLocaleDateString("es-CO")} · página ${i} de ${n}`, 14, 290); } }

$("pdfConf").onclick = () => {
  const si = conf.filter(d=>d.asiste), no = conf.filter(d=>!d.asiste);
  const ad = si.reduce((a,d)=>a+d.adultos,0), ni = si.reduce((a,d)=>a+d.ninos,0);
  const doc = pdfBase("Lista de confirmados", `${si.length} familias · ${ad} adultos · ${ni} niños · ${ad+ni} personas en total · ${no.length} no asisten`);
  doc.autoTable({ ...estilo, startY: 52, head:[["#","Nombre","Celular","Adultos","Niños","Mensaje","Fecha"]],
    body: si.map((d,k)=>[k+1, d.nombre, d.telefono||"", d.adultos, d.ninos, d.mensaje||"", fecha(d.creado_en)]),
    columnStyles:{0:{cellWidth:8},3:{halign:"center",cellWidth:16},4:{halign:"center",cellWidth:14},6:{cellWidth:26}} });
  if (no.length){ doc.autoTable({ ...estilo, startY: doc.lastAutoTable.finalY+8, head:[["No asisten","Celular","Mensaje"]], body: no.map(d=>[d.nombre,d.telefono||"",d.mensaje||""]) }); }
  pie(doc); doc.save("confirmados-primera-comunion.pdf");
};
$("pdfInv").onclick = () => {
  const filas = inv.map(i=>({...i,c:confirmacionDe(i)}));
  const env = filas.filter(f=>f.enviado).length, cf = filas.filter(f=>f.c&&f.c.asiste).length;
  const doc = pdfBase("Lista de invitados · checklist", `${filas.length} invitados · ${env} con invitación enviada · ${cf} confirmaron · ${filas.filter(f=>f.enviado&&!f.c).length} sin respuesta`);
  doc.autoTable({ ...estilo, startY: 52, head:[["#","Invitado","Celular","Enviada","Estado","Personas"]],
    body: filas.map((f,k)=>[k+1, f.nombre, f.telefono||"", f.enviado?"Sí":"", f.c?(f.c.asiste?"Confirmó":"No asiste"):(f.enviado?"Sin respuesta":"Por enviar"), f.c&&f.c.asiste?`${f.c.adultos} ad · ${f.c.ninos} ni`:""]),
    columnStyles:{0:{cellWidth:8},3:{halign:"center",cellWidth:18},4:{cellWidth:28},5:{cellWidth:24}} });
  pie(doc); doc.save("invitados-primera-comunion.pdf");
};
</script>
</body>
</html>
